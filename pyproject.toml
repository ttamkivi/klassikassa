[project]
name = "klassikassa"
version = "0.1.0"
description = "Class-fund treasurer for parents: who paid, what was spent, gentle reminders. Local data, no server."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1"]
dev = ["pytest>=8", "openpyxl>=3.1"]

[project.scripts]
klassikassa = "klassikassa.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["klassikassa"]

